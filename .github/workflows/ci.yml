name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install server dependencies from lockfile
        run: pnpm -C server install --frozen-lockfile

      - name: Test client
        run: pnpm run test:client

      - name: Test setup and packaging scripts
        run: pnpm run test:scripts

      - name: Test and type-check server
        run: pnpm -C server check

      - name: Validate source plugin
        run: pnpm run validate:plugin

      - name: Build and validate distributable plugin
        run: pnpm run package:plugin

      - name: Create plugin archive
        run: tar -czf dist/remnifold.tar.gz -C dist remnifold

      - name: Verify final plugin archive before publication
        run: node scripts/verify-plugin-archive.mjs dist/remnifold.tar.gz

      - name: Upload plugin archive
        uses: actions/upload-artifact@v7
        with:
          name: remnifold
          path: dist/remnifold.tar.gz
          if-no-files-found: error

      - name: Upload reproducible validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remnifold-validation
          path: dist/*validation.json
          if-no-files-found: warn
