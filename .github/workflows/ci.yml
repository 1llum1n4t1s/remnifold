name: CI

on:
  push:
    # Dependabot の PR は別の検証 workflow で扱う。
    branches-ignore:
      - 'dependabot/**'
    # Release publication is verified on release/*, not on tag pushes.
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ ref へ続けて push したとき、古い run を取り消して最新だけを検証する。
# main と release/* は取り消さない。main は版タグの配信ゲート（wait-main-ci.sh）が同じコミットの run の成功を待つため、
# 待機中（pending）の run が新しい push に置き換えられて消えないよう、group をコミット単位にする。
concurrency:
  group: ci-${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  native-package:
    name: native-package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # 4 ターゲットとも GitHub 提供ランナーが自分のネイティブ環境でビルドする（クロスビルド・手元ビルドは使わない）。
        # Linux x64 は glibc の下限を保つため latest ではなく ubuntu-24.04 に固定する。
        # 全行列は main・PR・release/*・手動実行のときだけ。それ以外のブランチへの push は ubuntu-24.04 の1構成だけ。
        include: ${{ fromJSON((github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}]' || '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]') }}
    runs-on: ${{ matrix.os }}
    # Environment deployment-branch policies are the credential boundary. Only
    # these environments own R2 secrets; validation has no distribution secrets.
    environment:
      name: ${{ github.event_name == 'push' && github.repository == '1llum1n4t1s/remnifold' && github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) && startsWith(github.ref, 'refs/heads/release/') && 'r2-staging' || 'validation' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI_TARGET: ${{ matrix.target }}
    # Each matrix job produces only its own key. GitHub merges unique names;
    # a shared output name would be overwritten by the last finishing target.
    outputs:
      windows_x64: ${{ steps.stage.outputs.windows_x64 }}
      macos_arm64: ${{ steps.stage.outputs.macos_arm64 }}
      linux_x64: ${{ steps.stage.outputs.linux_x64 }}
      linux_arm64: ${{ steps.stage.outputs.linux_arm64 }}
    steps:
      - name: Check out exact source commit with git
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT CHECKOUT_TOKEN authorization
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install locked Rust toolchain
        # Bootstrap uses the hosted runner's managed TEMP until isolation is configured.
        run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - name: Assert the runner builds the matrix target natively
        # matrix の runs-on の取り違え（例: ARM ランナーで x64 を作る）を、ビルド前に失敗させて防ぐ。
        run: |
          set -euo pipefail
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$CI_TARGET"
      - name: Configure isolated output directories
        run: |
          set -euo pipefail
          # 全 OS で $RUNNER_TEMP 配下に run/attempt/target 別の作業ルートを置く。特定のドライブやフォルダは前提にしない。
          # Windows は後段のパス比較と揃えるため、cygpath -m で区切りを / にした絶対パスへ変える。
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            temp="$(cygpath -m "$RUNNER_TEMP")"
            workspace="$(cygpath -m "$GITHUB_WORKSPACE")"
            executable=.exe
          else
            temp="$RUNNER_TEMP"
            workspace="$GITHUB_WORKSPACE"
            executable=
          fi
          root="$temp/remnifold-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$CI_TARGET"
          # release 以外の run は、rust-cache が復元・保存する固定パスの target を使う（キャッシュのキーに
          # CARGO_TARGET_DIR が入るため、run 別のパスでは一致しない）。release の run はキャッシュを使わず、
          # 従来どおり run/attempt 別の build を使う。
          build="$root/build"
          if [[ "$GITHUB_REF" != refs/heads/release/* ]]; then build="$workspace/target"; fi
          export CI_ROOT="$root"
          rustup run 1.100.0 rustc --edition 2024 dev/src/ci_runner.rs -o "$RUNNER_TEMP/remnifold-ci-paths.exe"
          "$RUNNER_TEMP/remnifold-ci-paths.exe" ensure-directory "$root"
          mkdir -p "$root/tmp" "$root/tools" "$root/validation" "$root/guard"
          {
            printf 'CI_ROOT=%s\n' "$root"
            printf 'TEMP=%s/tmp\nTMP=%s/tmp\nTMPDIR=%s/tmp\n' "$root" "$root" "$root"
            printf 'CARGO_TARGET_DIR=%s\nREMNIFOLD_TOOL_ROOT=%s/tools\n' "$build" "$root"
            printf 'REMNIFOLD_VALIDATION_DIR=%s/validation\n' "$root"
            printf 'REMNIFOLD_PACKAGE_BINARY=%s/%s/release/remnifold%s\n' "$build" "$CI_TARGET" "$executable"
            printf 'REMNIFOLD_NODE_GUARD_LOG=%s/validation/node-invocations.log\n' "$root"
          } >> "$GITHUB_ENV"
      - name: Reject Node and JavaScript package-manager subprocesses
        run: |
          set -euo pipefail
          cat > "$CI_ROOT/guard/main.rs" <<'RUST'
          use std::{env,fs::OpenOptions,io::Write};
          fn main() {
              if env::var_os("REMNIFOLD_NODE_GUARD_CANARY").is_none() {
                  let path = env::var("REMNIFOLD_NODE_GUARD_LOG").expect("guard log required");
                  let mut log = OpenOptions::new().create(true).append(true).open(path).expect("guard log unavailable");
                  writeln!(log,"forbidden JavaScript tool invocation").expect("guard log failed");
              }
              eprintln!("Node.js and JavaScript package managers are excluded from this validation");
              std::process::exit(91);
          }
          RUST
          executable=
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable=.exe; fi
          rustc --edition 2024 "$CI_ROOT/guard/main.rs" -o "$CI_ROOT/guard/node$executable"
          for name in nodejs npm npx pnpm yarn corepack wrangler; do
            cp "$CI_ROOT/guard/node$executable" "$CI_ROOT/guard/$name$executable"
          done
          guard_path="$CI_ROOT/guard"
          if [[ "$RUNNER_OS" == "Windows" ]]; then guard_path="$(cygpath -u "$guard_path")"; fi
          export PATH="$guard_path:$PATH"
          if REMNIFOLD_NODE_GUARD_CANARY=1 node --version; then exit 1; else test "$?" = 91; fi
          printf '%s/guard\n' "$CI_ROOT" >> "$GITHUB_PATH"
          printf 'REMNIFOLD_NODE_GUARD_READY=1\n' >> "$GITHUB_ENV"
      # 型チェックとテストは windows-server-contracts / windows-native-contracts の2 job へ分けて並列に走らせる。
      # ここには公開する実アーカイブの作成・検証・updater-test とステージだけを残す（package の build.rs が
      # esbuild を使うため prepare も残す）。公開は publish-r2 の needs で全 job の成功に縛る。
      # Cargo のキャッシュ（SHA 固定の rust-cache）は release 以外の run の Windows 要素だけで使う。release の run は
      # ステージ用の資格情報を持つため Action を実行しない。保存は main の run だけが行う。
      - name: Restore Cargo cache outside release runs
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' && !startsWith(github.ref, 'refs/heads/release/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '. -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare pinned native build tools
        run: cargo xtask prepare
      - name: Build native consumer archive
        run: cargo xtask package --target "$CI_TARGET" --source-commit "$GITHUB_SHA"
      - name: Verify final native archive before publication
        run: cargo xtask verify --target "$CI_TARGET" --binary "$REMNIFOLD_PACKAGE_BINARY" --archive "$GITHUB_WORKSPACE/dist/remnifold-$CI_TARGET.tar.gz" --source-commit "$GITHUB_SHA"
      - name: Exercise native plugin update and recovery
        run: cargo xtask updater-test --binary "$REMNIFOLD_PACKAGE_BINARY" --archive "$GITHUB_WORKSPACE/dist/remnifold-$CI_TARGET.tar.gz" --work-root "$CI_ROOT/validation/updater"
      - name: Verify no JavaScript runtime was invoked through PATH
        if: always()
        run: |
          set -euo pipefail
          test "${REMNIFOLD_NODE_GUARD_READY:-0}" = 1
          if [[ -s "$REMNIFOLD_NODE_GUARD_LOG" ]]; then
            printf 'A forbidden JavaScript tool invocation was recorded.\n' >&2
            exit 1
          fi
          printf '{"nativeGuard":true,"forbiddenPathInvocations":0,"scope":"PATH-resolved tools; absolute executable paths are not intercepted"}\n' > "$CI_ROOT/validation/node-free-validation.json"
      - name: Check whitespace errors
        run: git diff --check
      - name: Retain validation evidence in job diagnostics
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "${CI_ROOT:-}/validation" ]]; then
            {
              printf '### Native validation: %s\n\n' "$CI_TARGET"
              printf 'Validation reports retained during this job (PRs receive no distribution credentials):\n\n'
              "$RUNNER_TEMP/remnifold-ci-paths.exe" reports "$CI_ROOT/validation"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage verified native archive in private R2
        id: stage
        if: >-
          github.event_name == 'push' &&
          github.repository == '1llum1n4t1s/remnifold' &&
          github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) &&
          startsWith(github.ref, 'refs/heads/release/')
        env:
          CI_R2_ENVIRONMENT: r2-staging
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_CI_ACCESS_KEY_ID: ${{ secrets.R2_CI_ACCESS_KEY_ID }}
          R2_CI_SECRET_ACCESS_KEY: ${{ secrets.R2_CI_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          cargo xtask r2-stage --target "$CI_TARGET" --archive "$GITHUB_WORKSPACE/dist/remnifold-$CI_TARGET.tar.gz" --binary "$REMNIFOLD_PACKAGE_BINARY" --source-commit "$GITHUB_SHA" --apply

  # Worker の型チェックと real-workerd のサーバーテスト。native-package から分けて並列に走らせる。
  # 配布の資格情報を持たない検証専用 job で、Environment を選ばず、読み取り権限だけで動く。
  # matrix を使わず runs-on を直接書く（native-package の Windows 要素4件の数え方と job 名を変えないため）。
  windows-server-contracts:
    name: windows-server-contracts
    # main・PR・release/*・手動実行だけ。それ以外のブランチへの push は native-package の Linux 1構成だけで確かめる。
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI_LABEL: server-contracts
    steps:
      - name: Check out exact source commit with git
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git config core.autocrlf false
          git config core.eol lf
