name: CI

on:
  push:
    # Dependabot PRs validate Windows consumers; Unix inputs are verified on release pushes.
    branches-ignore:
      - 'dependabot/**'
    # Release publication is verified on release/*, not on tag pushes.
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    name: native-package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    # Environment deployment-branch policies are the credential boundary. Only
    # these environments own R2 secrets; validation has no distribution secrets.
    environment:
      name: ${{ github.event_name == 'push' && github.repository == '1llum1n4t1s/remnifold' && github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) && ((matrix.target == 'x86_64-pc-windows-msvc' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/heads/release/')) && 'r2-staging' || 'validation' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI_TARGET: ${{ matrix.target }}
    # Each matrix job produces only its own key. GitHub merges unique names;
    # a shared output name would be overwritten by the last finishing target.
    outputs:
      windows_x64: ${{ steps.stage.outputs.windows_x64 }}
      macos_arm64: ${{ steps.stage.outputs.macos_arm64 }}
      linux_x64: ${{ steps.stage.outputs.linux_x64 }}
      linux_arm64: ${{ steps.stage.outputs.linux_arm64 }}
    steps:
      - name: Check out exact source commit without executable Actions
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT CHECKOUT_TOKEN authorization
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install locked Rust toolchain
        # Bootstrap uses the hosted runner's managed TEMP until isolation is configured.
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: Configure isolated output directories
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            root="D:/Codex/remnifold/ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$CI_TARGET"
            executable=.exe
          else
            root="$RUNNER_TEMP/remnifold-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$CI_TARGET"
            executable=
          fi
          export CI_ROOT="$root"
          rustup run 1.99.1 rustc --edition 2024 dev/src/ci_runner.rs -o "$RUNNER_TEMP/remnifold-ci-paths.exe"
          "$RUNNER_TEMP/remnifold-ci-paths.exe" ensure-directory "$root"
          mkdir -p "$root/tmp" "$root/tools" "$root/validation" "$root/guard"
          {
            printf 'CI_ROOT=%s\n' "$root"
            printf 'TEMP=%s/tmp\nTMP=%s/tmp\nTMPDIR=%s/tmp\n' "$root" "$root" "$root"
            printf 'CARGO_TARGET_DIR=%s/build\nREMNIFOLD_TOOL_ROOT=%s/tools\n' "$root" "$root"
            printf 'REMNIFOLD_VALIDATION_DIR=%s/validation\n' "$root"
            printf 'REMNIFOLD_PACKAGE_BINARY=%s/build/%s/release/remnifold%s\n' "$root" "$CI_TARGET" "$executable"
            printf 'REMNIFOLD_NODE_GUARD_LOG=%s/validation/node-invocations.log\n' "$root"
          } >> "$GITHUB_ENV"
      - name: Reject Node and JavaScript package-manager subprocesses
        run: |
          set -euo pipefail
          cat > "$CI_ROOT/guard/main.rs" <<'RUST'
          use std::{env,fs::OpenOptions,io::Write};
          fn main() {
              if env::var_os("REMNIFOLD_NODE_GUARD_CANARY").is_none() {
                  let path = env::var("REMNIFOLD_NODE_GUARD_LOG").expect("guard log required");
                  let mut log = OpenOptions::new().create(true).append(true).open(path).expect("guard log unavailable");
                  writeln!(log,"forbidden JavaScript tool invocation").expect("guard log failed");
              }
              eprintln!("Node.js and JavaScript package managers are excluded from this validation");
              std::process::exit(91);
          }
          RUST
          executable=
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable=.exe; fi
          rustc --edition 2024 "$CI_ROOT/guard/main.rs" -o "$CI_ROOT/guard/node$executable"
          for name in nodejs npm npx pnpm yarn corepack wrangler; do
            cp "$CI_ROOT/guard/node$executable" "$CI_ROOT/guard/$name$executable"
          done
          guard_path="$CI_ROOT/guard"
          if [[ "$RUNNER_OS" == "Windows" ]]; then guard_path="$(cygpath -u "$guard_path")"; fi
          export PATH="$guard_path:$PATH"
          if REMNIFOLD_NODE_GUARD_CANARY=1 node --version; then exit 1; else test "$?" = 91; fi
          printf '%s/guard\n' "$CI_ROOT" >> "$GITHUB_PATH"
          printf 'REMNIFOLD_NODE_GUARD_READY=1\n' >> "$GITHUB_ENV"
      - name: Prepare pinned native build tools
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo xtask prepare
      - name: Type-check Worker source
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo xtask type-check
      - name: Test native runtime and development contracts
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo xtask native-test
      - name: Test authenticated Worker in local workerd
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo xtask server-test --work-root "$CI_ROOT/validation/server"
      - name: Test native client, capture, recall, and ranking
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo xtask client-test --work-root "$CI_ROOT/validation/client"
      - name: Build native consumer archive
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo xtask package --target "$CI_TARGET" --source-commit "$GITHUB_SHA"
      - name: Verify final native archive before publication
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo xtask verify --target "$CI_TARGET" --binary "$REMNIFOLD_PACKAGE_BINARY" --archive "$GITHUB_WORKSPACE/dist/remnifold-$CI_TARGET.tar.gz" --source-commit "$GITHUB_SHA"
      - name: Exercise native plugin update and recovery
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo xtask updater-test --binary "$REMNIFOLD_PACKAGE_BINARY" --archive "$GITHUB_WORKSPACE/dist/remnifold-$CI_TARGET.tar.gz" --work-root "$CI_ROOT/validation/updater"
      - name: Verify no JavaScript runtime was invoked through PATH
        if: always()
        run: |
          set -euo pipefail
          test "${REMNIFOLD_NODE_GUARD_READY:-0}" = 1
          if [[ -s "$REMNIFOLD_NODE_GUARD_LOG" ]]; then
            printf 'A forbidden JavaScript tool invocation was recorded.\n' >&2
            exit 1
          fi
          printf '{"nativeGuard":true,"forbiddenPathInvocations":0,"scope":"PATH-resolved tools; absolute executable paths are not intercepted"}\n' > "$CI_ROOT/validation/node-free-validation.json"
      - name: Check whitespace errors
        run: git diff --check
      - name: Retain validation evidence in job diagnostics
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "${CI_ROOT:-}/validation" ]]; then
            {
              printf '### Native validation: %s\n\n' "$CI_TARGET"
              printf 'Validation reports retained during this job (PRs receive no distribution credentials):\n\n'
              "$RUNNER_TEMP/remnifold-ci-paths.exe" reports "$CI_ROOT/validation"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage verified native archive in private R2
        id: stage
        if: >-
          github.event_name == 'push' &&
          github.repository == '1llum1n4t1s/remnifold' &&
          github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) &&
          ((matrix.target == 'x86_64-pc-windows-msvc' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/heads/release/'))
        env:
          CI_R2_ENVIRONMENT: r2-staging
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_CI_ACCESS_KEY_ID: ${{ secrets.R2_CI_ACCESS_KEY_ID }}
          R2_CI_SECRET_ACCESS_KEY: ${{ secrets.R2_CI_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ "$CI_TARGET" == "x86_64-pc-windows-msvc" ]]; then
            cargo xtask r2-stage --target "$CI_TARGET" --archive "$GITHUB_WORKSPACE/dist/remnifold-$CI_TARGET.tar.gz" --binary "$REMNIFOLD_PACKAGE_BINARY" --source-commit "$GITHUB_SHA" --apply
          else
            cargo xtask local-input import --target "$CI_TARGET" --work-root "$CI_ROOT/local-input" --apply
          fi

  publish-r2:
    name: publish-r2
    needs: native-package
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.native-package.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == '1llum1n4t1s/remnifold' &&
      github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) &&
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    environment: r2-release
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      statuses: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact publication source without executable Actions
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT CHECKOUT_TOKEN authorization
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Configure isolated publication output
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/remnifold-publish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -L "$root"
          mkdir -p "$root/tmp"
          {
            printf 'CI_ROOT=%s\nCARGO_TARGET_DIR=%s/build\n' "$root" "$root"
            printf 'REMNIFOLD_R2_WORK_ROOT=%s/validation\n' "$root"
            printf 'TEMP=%s/tmp\nTMP=%s/tmp\nTMPDIR=%s/tmp\n' "$root" "$root" "$root"
          } >> "$GITHUB_ENV"
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: Require the release branch to match package version
        run: cargo xtask ci-release-branch
      - name: Verify all staged targets and publish immutable R2 release
        env:
          CI_R2_ENVIRONMENT: r2-release
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
          REMNIFOLD_R2_STAGE_RECORDS: ${{ toJSON(needs.native-package.outputs) }}
          REMNIFOLD_R2_NEEDS_RESULT: ${{ needs.native-package.result }}
        run: cargo xtask r2-publish --apply
