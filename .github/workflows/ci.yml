name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Configure native temporary directories
        shell: bash
        run: |
          printf 'TEMP=%s\nTMP=%s\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked Rust toolchain
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --target ${{ matrix.target }} && rustup default 1.97.1
      - name: Test native runtime
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Exercise native client against authenticated Worker
        shell: bash
        env:
          REMNIFOLD_VALIDATION_DIR: ${{ github.workspace }}/dist/native-validation
        run: |
          binary="$PWD/native/target/debug/remnifold"
          if [[ "${{ runner.os }}" == "Windows" ]]; then binary="$binary.exe"; fi
          node --experimental-transform-types scripts/native-client-e2e.mjs --binary "$binary"
      - name: Build native consumer plugin
        run: node scripts/build-native.mjs --target ${{ matrix.target }} --source-commit ${{ github.sha }}
      - name: Validate native consumer plugin
        run: node scripts/validate-plugin.mjs dist/${{ matrix.target }}/remnifold
      - name: Create native plugin archive
        run: node scripts/lib/tar.mjs --format ustar -czf dist/remnifold-${{ matrix.target }}.tar.gz -C dist/${{ matrix.target }} remnifold
      - name: Verify native archive before publication
        run: node scripts/verify-plugin-archive.mjs dist/remnifold-${{ matrix.target }}.tar.gz
      - name: Exercise native plugin update and recovery
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            work="D:/Codex/remnifold/native-updater-ci"
            binary="$PWD/dist/${{ matrix.target }}/remnifold/bin/remnifold.exe"
          else
            work="${{ runner.temp }}/remnifold-native-updater"
            binary="$PWD/dist/${{ matrix.target }}/remnifold/bin/remnifold"
          fi
          node scripts/package-plugin.mjs
          node scripts/local-plugin-update-e2e.mjs --archive "$PWD/dist/remnifold-${{ matrix.target }}.tar.gz" --work-root "$work" --updater-binary "$binary" --legacy-root "$PWD/dist/remnifold"
      - uses: actions/upload-artifact@v7
        with:
          name: remnifold-${{ matrix.target }}
          path: dist/remnifold-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Stage native updater validation evidence
        if: always()
        shell: bash
        run: |
          node --input-type=module -e 'import { existsSync, mkdirSync, copyFileSync } from "node:fs"; import path from "node:path"; const work = process.platform === "win32" ? "D:/Codex/remnifold/native-updater-ci" : path.join(process.env.RUNNER_TEMP, "remnifold-native-updater"); const input = path.join(work, "local-plugin-update-validation.json"); if (existsSync(input)) { mkdirSync("dist/native-validation", { recursive: true }); copyFileSync(input, "dist/native-validation/local-plugin-update-validation.json"); }'
      - name: Upload native validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remnifold-native-validation-${{ matrix.target }}
          path: dist/native-validation/*.json
          if-no-files-found: warn
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install server dependencies from lockfile
        run: pnpm -C server install --frozen-lockfile

      - name: Test client
        run: pnpm run test:client

      - name: Test setup and packaging scripts
        run: pnpm run test:scripts

      - name: Test and type-check server
        run: pnpm -C server check

      - name: Validate source plugin
        run: pnpm run validate:plugin

      - name: Build and validate distributable plugin
        run: pnpm run package:plugin

      - name: Create plugin archive
        run: node scripts/lib/tar.mjs -czf dist/remnifold.tar.gz -C dist remnifold

      - name: Verify final plugin archive before publication
        run: node scripts/verify-plugin-archive.mjs dist/remnifold.tar.gz

      - name: Upload plugin archive
        uses: actions/upload-artifact@v7
        with:
          name: remnifold
          path: dist/remnifold.tar.gz
          if-no-files-found: error

      - name: Upload reproducible validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remnifold-validation
          path: dist/*validation.json
          if-no-files-found: warn
