      - name: Configure isolated output directories
        run: |
          set -euo pipefail
          # native-package と同じく $RUNNER_TEMP 配下に run/attempt/job 別の作業ルートを置く。
          temp="$(cygpath -m "$RUNNER_TEMP")"
          root="$temp/remnifold-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$CI_LABEL"
          # release 以外の run は rust-cache の固定パスの target を使う（native-package と同じ理由）。
          build="$root/build"
          if [[ "$GITHUB_REF" != refs/heads/release/* ]]; then build="$(cygpath -m "$GITHUB_WORKSPACE")/target"; fi
          export CI_ROOT="$root"
          rustup run 1.100.0 rustc --edition 2024 dev/src/ci_runner.rs -o "$RUNNER_TEMP/remnifold-ci-paths.exe"
          "$RUNNER_TEMP/remnifold-ci-paths.exe" ensure-directory "$root"
