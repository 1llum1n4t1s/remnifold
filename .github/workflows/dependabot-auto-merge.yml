name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  check_run:
    types: [completed]
  status:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: dependabot-auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.repository_owner == '1llum1n4t1s' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.user.id == 49699333) &&
      (github.event_name != 'status' || github.event.state == 'success') &&
      (github.event_name != 'check_run' || github.event.check_run.app.slug != 'github-actions')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch trusted default-branch policy without executable Actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "refs/heads/$branch"
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT GH_TOKEN authorization
          git checkout --detach FETCH_HEAD
      - name: Configure isolated policy build output
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/remnifold-policy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -L "$root"
          mkdir -p "$root/tmp"
          printf 'CARGO_TARGET_DIR=%s/build\nTEMP=%s/tmp\nTMP=%s/tmp\nTMPDIR=%s/tmp\n' "$root" "$root" "$root" "$root" >> "$GITHUB_ENV"
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: Verify CI and merge dependency-only updates
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_WORKFLOWS: '[".github/workflows/ci.yml"]'
        run: cargo xtask dependabot --apply
