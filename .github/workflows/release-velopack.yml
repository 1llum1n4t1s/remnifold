# Setup（Velopack）の Windows 版を梱包・署名し、R2（https://remnifold-updates.kagayoi.com/velopack/）へ配信する。
# 厳格な install 用の releases/<version>/index.json を配信する ci.yml とは別のワークフローで、互いに触れない。
#
# 方針:
# - 実行可能な Actions を使わない（R2 と署名の Secrets を持つため。SHA 固定の Action を使う ci.yml とは異なる）。
#   checkout は git のコマンドで行い、Sigilune は R2 配布の版と
#   コミット SHA を固定して git で取得して導入する。成果物の受け渡しに upload-artifact が要らないよう、
#   梱包・署名と配信は同じジョブで行う。
# - 署名の Secrets と R2 の Secrets は、それぞれ使う step だけへ渡す（梱包・ビルドの step には渡さない）。
# - 起動は release/* ブランチへの push、または同ブランチ上の手動起動（workflow_dispatch）。タグでは起動しない
#   （タグと GitHub Release は作らない運用）。Environment の deployment branch policy も release/* に限る。
# - push では ci.yml と同時に起動するため、公開バケットへ書く前に gate ジョブで「同じコミットの ci.yml が成功し、
#   publish-r2 が成功済み」を待って確認する（AGENTS.md の「公開バケットへの書き込みは、全ターゲット成功後の
#   publisher だけ」という境界を守るため）。ci.yml 自体は触らない: 署名の失敗が strict 公開の witness
#   （唯一成功した publish-r2 job）を壊さないよう、署名はこのワークフローに分けている。
#   workflow_run は使わない（GITHUB_REF が既定ブランチになり、release/* 限定の r2-release に弾かれるため）。
#   版は ci-release-branch（release/<版> と Cargo の版の一致確認）を通す。
# - gate は Environment・Secrets を持たず、読み取り専用（actions: read, contents: read）で動く。待機の本体は
#   scripts/velopack/wait-ci-publication.sh（スタブの gh で検証できる）。concurrency は windows-installer だけに掛け、
#   gate の待機中に直列の枠を占有しない。
# - この Windows 版のほか、署名済みの bootstrap 実行ファイル（remnifold-bootstrap-<版>-x86_64-pc-windows-msvc.exe）も
#   同じ梱包・配信で R2 の版付き不変キーへ置く（scripts/velopack/pack-windows.ps1 が取り出し、publish-r2.ps1 が置く）。
# - 本人が事前に用意するもの（リポジトリの設定。値はここに書かない）:
#     Environment `r2-release`（release/* のみ）に Secrets: R2_RELEASE_ACCESS_KEY_ID / R2_RELEASE_SECRET_ACCESS_KEY /
#       SIGILUNE_EMAIL / SIGILUNE_TOTP_URI、Variables: CLOUDFLARE_ACCOUNT_ID。
#     署名の Secrets を配信の Secrets から分けたい場合は、署名用の Environment を別に作り、ジョブを分けて
#     成果物を受け渡す形に変える（その場合は upload-artifact 相当の受け渡し方法を決める必要がある）。
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    if: github.repository == '1llum1n4t1s/remnifold' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    # ci.yml の native-package（90 分）と publish-r2（30 分）が直列に終わるまで待てる長さ。待機の上限
    # （GATE_TIMEOUT_SECONDS の既定 140 分）より長くする。
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact source commit without executable Actions
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT CHECKOUT_TOKEN authorization
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Wait for the same commit's CI to succeed and publish to R2
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/velopack/wait-ci-publication.sh

  windows-installer:
    name: windows-installer
    needs: gate
    if: github.repository == '1llum1n4t1s/remnifold' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/release/')
    # 配信は 1 本ずつ。gate の待機中に枠を占有しないよう、concurrency はこのジョブにだけ掛ける。
    concurrency:
      group: release-velopack
      cancel-in-progress: false
    runs-on: windows-latest
    environment: r2-release
    timeout-minutes: 60
    env:
      # vpk 1.2.161 は新しい .NET ランタイムでも動かす（ランナーに合う版が無い場合に備える）。
      DOTNET_ROLL_FORWARD: Major
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact source commit without executable Actions
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Unexpected commit id.' }
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CHECKOUT_TOKEN"))
          Write-Host "::add-mask::$authorization"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $authorization"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:GIT_CONFIG_VALUE_0, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_COUNT
          git checkout --detach FETCH_HEAD
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Checked-out commit differs from the pushed commit.' }

      - name: Prepare Rust and Velopack CLI
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          rustup target add x86_64-pc-windows-msvc
          # scripts/velopack/pack-windows.ps1 が要求する固定版。
          dotnet tool install --global vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $help = (vpk --help 2>&1 | Out-String) -replace "`e\[[0-9;]*m", ''
          if ($help -notmatch '\bVelopack CLI 1\.2\.161\b') { Write-Host $help; throw 'vpk 1.2.161 could not start.' }

      - name: Require the release branch to match the package version
        run: cargo xtask ci-release-branch

      - name: Build the native executable
        # 依存 crate の build script も動くため、この step には署名用 Secrets を渡さない。
        # 梱包スクリプトの cargo build と同じ条件（既定の機能のみ。update-feed-test を含めない）でビルドする。
        # build.rs は固定版の esbuild（.devtools/<host>/）を要求する。新しいランナーには無いため、先に用意する
        # （pack-windows.ps1 は prepare を呼ばない）。
        run: |
          cargo xtask prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $env:RUNNER_TEMP 'remnifold-target'
          "CARGO_TARGET_FOR_PACK=$target" >> $env:GITHUB_ENV
          cargo build --locked --release --target x86_64-pc-windows-msvc --target-dir $target --bin remnifold
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Sigilune at the pinned version without executable Actions
        run: |
          $ErrorActionPreference = 'Stop'
          # Sigilune は R2 配布の版とコミット SHA を固定する（タグは使わない）。更新するときはこの 2 行を同時に変える。
          $sigiluneVersion = '1.1.4'
          $sigiluneCommit = 'b2142b4d1084ec2a5b0a18e83cea7e886406b389'
          $source = Join-Path $env:RUNNER_TEMP 'sigilune-src'
          git init -q $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $source fetch --depth 1 https://github.com/1llum1n4t1s/Sigilune.git $sigiluneCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $source checkout -q --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Join-Path $env:RUNNER_TEMP 'sigilune'
          & (Join-Path $source 'install.ps1') -Version $sigiluneVersion -InstallDir $install -NoPath
          "SIGILUNE_EXE=$(Join-Path $install 'sigilune.exe')" >> $env:GITHUB_ENV
          # ランナーごとに独立したセッションキャッシュを使う。
          "SIGILUNE_HOME=$(Join-Path $env:RUNNER_TEMP 'sigilune-home')" >> $env:GITHUB_ENV

      - name: Pack and sign the installer
        env:
          SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
          SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'remnifold-installer'
          New-Item -ItemType Directory -Path $work | Out-Null
          "WORK_DIR=$work" >> $env:GITHUB_ENV
          & ./scripts/velopack/pack-windows.ps1 -WorkDirectory $work -Sign -CargoTargetDirectory $env:CARGO_TARGET_FOR_PACK

      - name: Sign out of Sigilune
        # ランナー上の Certum セッションを残さない。
        if: always()
        run: |
          if ($env:SIGILUNE_EXE -and (Test-Path -LiteralPath $env:SIGILUNE_EXE)) { & $env:SIGILUNE_EXE logout | Out-Null }

      - name: Publish the feed and installer to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:WORK_DIR 'packages/RemnifoldApp-win-Setup.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike 'CN=Open Source Developer Yuichiro Shinozaki*' -or !$signature.TimeStamperCertificate) { throw 'Setup signature verification failed.' }
          "SHA256 $((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash)"
          # bootstrap（署名済みの remnifold.exe）も、置く前に同じ署名検査を通す。ちょうど 1 つだけあること。
          $bootstraps = @(Get-ChildItem -LiteralPath (Join-Path $env:WORK_DIR 'packages') -Filter 'remnifold-bootstrap-*-x86_64-pc-windows-msvc.exe' -File)
          if ($bootstraps.Count -ne 1) { throw 'Expected exactly one bootstrap executable.' }
          $bootstrapSignature = Get-AuthenticodeSignature -LiteralPath $bootstraps[0].FullName
          if ($bootstrapSignature.Status -ne 'Valid' -or $bootstrapSignature.SignerCertificate.Subject -notlike 'CN=Open Source Developer Yuichiro Shinozaki*' -or !$bootstrapSignature.TimeStamperCertificate) { throw 'Bootstrap signature verification failed.' }
          "Bootstrap SHA256 $((Get-FileHash -LiteralPath $bootstraps[0].FullName -Algorithm SHA256).Hash)"
          # 版付きの成果物は新規作成のみ（上書きしない）。releases.win.json は最後に置く。
          & ./scripts/velopack/publish-r2.ps1 -PackagesDirectory (Join-Path $env:WORK_DIR 'packages') -Channel win
