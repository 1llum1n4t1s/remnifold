# Setup（Velopack）を OS ごとに梱包・署名し、R2（https://remnifold-updates.kagayoi.com/velopack/）へ配信する。
# 厳格な install 用の releases/<version>/index.json を配信する ci.yml とは別のワークフローで、互いに触れない。
# 厳格な install 経路は 1.0.32 で凍結した（新しい版は ci.yml の publish-r2 で公開しない）。新しい版は Setup だけを
# このワークフローで配信する。
#
# job（配信の 4 チャネルは互いに独立。どれも gate だけを needs に持ち、ある OS の失敗は他の OS の配信に影響しない）:
#   gate               ubuntu-latest       Secrets なし。起点のタグを確かめ、main の ci.yml（速い検査）の成功を待つ
#   windows-installer  windows-latest      チャネル win         Certum（Sigilune）で署名。署名済みの bootstrap も置く
#   macos-installer    macos-latest        チャネル osx         Developer ID で署名・公証（一時キーチェーン + App Store Connect API キー）
#   linux-installer    ubuntu-24.04        チャネル linux-x64   署名なし（HTTPS とフィードのハッシュで信頼する）
#                      ubuntu-24.04-arm    チャネル linux-arm64 同上
# Linux は glibc 2.39（ubuntu-24.04）以下にそろえるため、ubuntu-latest ではなく ubuntu-24.04 に固定する
# （梱包した実行ファイルが glibc 2.39 を超える記号を使えば失敗させる）。macOS は MACOSX_DEPLOYMENT_TARGET=11.0。
#
# 方針:
# - 実行可能な Actions を使わない（R2 と署名の Secrets を持つため。SHA 固定の Action を使う ci.yml とは異なる）。
#   checkout は git のコマンドで行い、Sigilune は R2 配布の版とコミット SHA を固定して git で取得して導入する。
#   成果物の受け渡しに upload-artifact が要らないよう、梱包・署名と配信は同じ job で行う。
# - 署名の Secrets（Sigilune・Apple）と R2 の Secrets は、それぞれ使う step だけへ渡す（ビルド・梱包の step には
#   渡さない。macOS の梱包 step へは identity 名・プロファイル名・キーチェーンのパスだけを渡す）。
# - 起動は main のコミットに付けた軽量タグ v<x.y.z> の push（数字 3 つの版のときだけ。v1 や v1.2.3-rc では起動しない）。
#   やり直しは同じタグを ref にした手動起動（gh workflow run release-velopack.yml --ref v<x.y.z>）。GitHub Release は作らない。
#   Environment r2-release の deployment policy もタグ v*.*.* に限る。
# - gate（Environment・Secrets なし、actions: read と contents: read だけ）が、公開バケットへ書く前に無条件で確かめる
#   （本体は scripts/velopack/wait-main-ci.sh。スタブの gh で検証できる）:
#   ref がタグで厳密な v<x.y.z>、タグ名が v<.codex-plugin/plugin.json の版>、軽量タグで GITHUB_SHA を指す、
#   GITHUB_SHA が既定ブランチの祖先、同じコミットを既定ブランチへ push したときの ci.yml が成功（main の run は速い検査
#   だけで、native-package と publish-r2 は skipped。タグの push で起動する ci.yml の全構成の run は配信と並行する
#   事後確認で、成否は待たない）。待った後にもタグが動いていないことを確かめる。
#   各配信 job も、Secrets を使う step より前に cargo xtask ci-release-tag（refs/tags/v<plugin.json の版>）を通す。
#   workflow_run は使わない（GITHUB_REF が既定ブランチになり、タグに限る r2-release に弾かれるため）。
# - 部分配信と再実行: 各配信 job は、公開 URL の velopack/releases.<channel>.json（Secrets なしで取得。404 は未配信）に
#   その版が載っているかを先に調べ、載っていれば梱包と配信を飛ばす（notice を出す）。そのため、dispatch や失敗した job の
#   「Re-run failed jobs」は、配信済みのチャネルに衝突しない。ある OS だけが失敗したときは、その job だけ再実行すればよい。
#   そのチャネルにより新しい版が既に載っている場合は失敗にする（古い版の配信でフィードが巻き戻るのを防ぐ）。
#   版付きの nupkg を R2 へ置いた後（releases.<channel>.json の前）で落ちた場合は、再実行しても署名・梱包のやり直しで
#   内容が変わり、既存の nupkg と一致せず失敗する（版付きの成果物は上書きしない）。その場合は patch を上げて出し直す。
# - concurrency は配信 job ごと・チャネルごとに掛ける（ワークフロー直下には置かない。gate の待機中に枠を占有せず、
#   同じ group に 4 job を入れて待機中の job が取り消されることもない）。
# - 署名は ci.yml へ入れない（ci.yml は PR・手動実行・release/*・版タグで全ターゲットのビルド・検証を担い、旧版の
#   strict 公開の witness も ci.yml にある）。
# - 本人が事前に用意するもの（リポジトリの設定。値はここに書かない）:
#     Environment `r2-release`（deployment policy はタグ v*.*.*）に
#       Secrets:   R2_RELEASE_ACCESS_KEY_ID / R2_RELEASE_SECRET_ACCESS_KEY（R2）
#                  SIGILUNE_EMAIL / SIGILUNE_TOTP_URI（Windows の署名）
#                  APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 / APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 / APPLE_P12_PASSWORD
#                  APPLE_NOTARY_API_KEY_P8_BASE64 / APPLE_NOTARY_API_KEY_ID / APPLE_NOTARY_API_ISSUER_ID（macOS の署名・公証）
#       Variables: CLOUDFLARE_ACCOUNT_ID / MACOS_SIGN_APP_IDENTITY / MACOS_SIGN_INSTALL_IDENTITY
#     署名の Secrets を配信の Secrets から分けたい場合は、署名用の Environment を別に作り、ジョブを分けて
#     成果物を受け渡す形に変える（その場合は upload-artifact 相当の受け渡し方法を決める必要がある）。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    if: github.repository == '1llum1n4t1s/remnifold' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # main の ci.yml（速い検査。各 job の上限は 90 分）が終わるまで待てる長さ。待機の上限
    # （GATE_TIMEOUT_SECONDS の既定 140 分）より長くする。
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact source commit without executable Actions
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT CHECKOUT_TOKEN authorization
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify the version tag and wait for the same commit's CI on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/velopack/wait-main-ci.sh

  windows-installer:
    name: windows-installer
    needs: gate
    if: github.repository == '1llum1n4t1s/remnifold' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    # 配信はチャネルごとに 1 本ずつ。gate の待機中に枠を占有しないよう、concurrency はこのジョブにだけ掛ける。
    concurrency:
      group: release-velopack
      cancel-in-progress: false
    runs-on: windows-latest
    environment: r2-release
    timeout-minutes: 60
    env:
      # vpk 1.2.161 は新しい .NET ランタイムでも動かす（ランナーに合う版が無い場合に備える）。
      DOTNET_ROLL_FORWARD: Major
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact source commit without executable Actions
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Unexpected commit id.' }
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CHECKOUT_TOKEN"))
          Write-Host "::add-mask::$authorization"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $authorization"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:GIT_CONFIG_VALUE_0, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_COUNT
          git checkout --detach FETCH_HEAD
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Checked-out commit differs from the pushed commit.' }

      - name: Prepare Rust and Velopack CLI
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          rustup target add x86_64-pc-windows-msvc
          # scripts/velopack/pack-windows.ps1 が要求する固定版。
          dotnet tool install --global vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $help = (vpk --help 2>&1 | Out-String) -replace "`e\[[0-9;]*m", ''
          if ($help -notmatch '\bVelopack CLI 1\.2\.161\b') { Write-Host $help; throw 'vpk 1.2.161 could not start.' }

      - name: Require the version tag to match the package version
        run: |
          $ErrorActionPreference = 'Stop'
          cargo xtask ci-release-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VERSION=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_ENV

      - name: Skip when this version is already published on the win channel
        # 公開 URL のフィードを Secrets なしで取得する（404 は未配信）。
        run: |
          $ErrorActionPreference = 'Stop'
          $published = $false
          $response = Invoke-WebRequest -Uri 'https://remnifold-updates.kagayoi.com/velopack/releases.win.json' -Headers @{ 'Cache-Control' = 'no-cache' } -SkipHttpErrorCheck
          if ($response.StatusCode -eq 404) { Write-Host 'No feed yet on the win channel.' }
          elseif ($response.StatusCode -eq 200) {
            $text = if ($response.Content -is [byte[]]) { [Text.Encoding]::UTF8.GetString($response.Content) } else { [string]$response.Content }
            $feed = $text | ConvertFrom-Json
            # より新しい版が載っていれば止める（古い版を配信すると、固定名の Setup とフィードが巻き戻るため）。
            # Assets が配列でない・版の形が想定外のときも失敗にする（未配信と誤認しない）。
            if ($null -eq $feed.Assets -or $feed.Assets -isnot [array] -and $feed.Assets -isnot [System.Management.Automation.PSCustomObject]) { throw 'The win feed has no Assets array.' }
            $wanted = [version]$env:VERSION
            $versions = @($feed.Assets | ForEach-Object {
              if ($_.Version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version in the win feed: $($_.Version)" }
              [version]$_.Version
            })
            if (@($versions | Where-Object { $_ -gt $wanted }).Count -gt 0) { throw 'A newer version is already published on the win channel. Publishing an older one would roll the feed back; release a new patch instead.' }
            $published = @($versions | Where-Object { $_ -eq $wanted }).Count -gt 0
          }
          else { throw "Unexpected HTTP status $($response.StatusCode) from the win feed." }
          "PUBLISHED=$($published.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          if ($published) { Write-Host "::notice::Version $env:VERSION is already published on the win channel; packing and publishing are skipped." }

      - name: Build the native executable
        if: env.PUBLISHED != 'true'
        # 依存 crate の build script も動くため、この step には署名用 Secrets を渡さない。
        # 梱包スクリプトの cargo build と同じ条件（既定の機能のみ。update-feed-test を含めない）でビルドする。
        # build.rs は固定版の esbuild（.devtools/<host>/）を要求する。新しいランナーには無いため、先に用意する
        # （pack-windows.ps1 は prepare を呼ばない）。
        run: |
          cargo xtask prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $env:RUNNER_TEMP 'remnifold-target'
          "CARGO_TARGET_FOR_PACK=$target" >> $env:GITHUB_ENV
          cargo build --locked --release --target x86_64-pc-windows-msvc --target-dir $target --bin remnifold
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Sigilune at the pinned version without executable Actions
        if: env.PUBLISHED != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          # Sigilune は R2 配布の版とコミット SHA を固定する（タグは使わない）。更新するときはこの 2 行を同時に変える。
          $sigiluneVersion = '1.1.4'
          $sigiluneCommit = 'b2142b4d1084ec2a5b0a18e83cea7e886406b389'
          $source = Join-Path $env:RUNNER_TEMP 'sigilune-src'
          git init -q $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $source fetch --depth 1 https://github.com/1llum1n4t1s/Sigilune.git $sigiluneCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $source checkout -q --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Join-Path $env:RUNNER_TEMP 'sigilune'
          & (Join-Path $source 'install.ps1') -Version $sigiluneVersion -InstallDir $install -NoPath
          "SIGILUNE_EXE=$(Join-Path $install 'sigilune.exe')" >> $env:GITHUB_ENV
          # ランナーごとに独立したセッションキャッシュを使う。
          "SIGILUNE_HOME=$(Join-Path $env:RUNNER_TEMP 'sigilune-home')" >> $env:GITHUB_ENV

      - name: Pack and sign the installer
        if: env.PUBLISHED != 'true'
        env:
          SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
          SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'remnifold-installer'
          New-Item -ItemType Directory -Path $work | Out-Null
          "WORK_DIR=$work" >> $env:GITHUB_ENV
          & ./scripts/velopack/pack-windows.ps1 -WorkDirectory $work -Sign -CargoTargetDirectory $env:CARGO_TARGET_FOR_PACK

      - name: Sign out of Sigilune
        # ランナー上の Certum セッションを残さない。
        if: always()
        run: |
          if ($env:SIGILUNE_EXE -and (Test-Path -LiteralPath $env:SIGILUNE_EXE)) { & $env:SIGILUNE_EXE logout | Out-Null }

      - name: Publish the feed and installer to R2
        if: env.PUBLISHED != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:WORK_DIR 'packages/RemnifoldApp-win-Setup.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike 'CN=Open Source Developer Yuichiro Shinozaki*' -or !$signature.TimeStamperCertificate) { throw 'Setup signature verification failed.' }
          "SHA256 $((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash)"
          # bootstrap（署名済みの remnifold.exe）も、置く前に同じ署名検査を通す。ちょうど 1 つだけあること。
          $bootstraps = @(Get-ChildItem -LiteralPath (Join-Path $env:WORK_DIR 'packages') -Filter 'remnifold-bootstrap-*-x86_64-pc-windows-msvc.exe' -File)
          if ($bootstraps.Count -ne 1) { throw 'Expected exactly one bootstrap executable.' }
          $bootstrapSignature = Get-AuthenticodeSignature -LiteralPath $bootstraps[0].FullName
          if ($bootstrapSignature.Status -ne 'Valid' -or $bootstrapSignature.SignerCertificate.Subject -notlike 'CN=Open Source Developer Yuichiro Shinozaki*' -or !$bootstrapSignature.TimeStamperCertificate) { throw 'Bootstrap signature verification failed.' }
          "Bootstrap SHA256 $((Get-FileHash -LiteralPath $bootstraps[0].FullName -Algorithm SHA256).Hash)"
          # 版付きの成果物は新規作成のみ（上書きしない）。releases.win.json は最後に置く。
          & ./scripts/velopack/publish-r2.ps1 -PackagesDirectory (Join-Path $env:WORK_DIR 'packages') -Channel win

  macos-installer:
    name: macos-installer
    needs: gate
    if: github.repository == '1llum1n4t1s/remnifold' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: release-velopack-osx
      cancel-in-progress: false
    runs-on: macos-latest
    environment: r2-release
    timeout-minutes: 90
    env:
      # 動作要件（macOS 11 以降）を明示する（aarch64-apple-darwin の既定と同じ値）。
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      # vpk 1.2.161 を、ランナーにある新しい .NET でも動かす（ランナーに合う版が無い場合に備える）。
      DOTNET_ROLL_FORWARD: Major
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact source commit without executable Actions
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Unexpected commit id.' >&2; exit 1; }
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT CHECKOUT_TOKEN authorization
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prepare Rust
        run: |
          set -euo pipefail
          test "$(uname -s)-$(uname -m)" = 'Darwin-arm64'
          rustup toolchain install 1.100.0 --profile minimal --target aarch64-apple-darwin
          rustup default 1.100.0

      - name: Require the version tag to match the package version
        run: |
          set -euo pipefail
          cargo xtask ci-release-tag
          printf 'VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Skip when this version is already published on the osx channel
        # 公開 URL のフィードを Secrets なしで取得する（404 は未配信）。
        run: |
          set -euo pipefail
          published=false
          feed="$RUNNER_TEMP/releases.osx.json"
          status="$(curl -sS --retry 3 -H 'Cache-Control: no-cache' -o "$feed" -w '%{http_code}' https://remnifold-updates.kagayoi.com/velopack/releases.osx.json)"
          case "$status" in
            404) echo 'No feed yet on the osx channel.' ;;
            200)
              # より新しい版が載っていれば止める（古い版を配信すると、固定名の Setup とフィードが巻き戻るため）。
              # 読み取れない本文・Assets が配列でない・版の形が想定外のときも失敗にする（未配信と誤認しない）。
              published="$(python3 -I - "$feed" "$VERSION" <<'PY'
          import json, re, sys

          def key(value):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", value if isinstance(value, str) else "")
              if not match:
                  raise SystemExit("Unexpected version in the feed: %r" % (value,))
              return tuple(int(part) for part in match.groups())

          with open(sys.argv[1], encoding="utf-8") as handle:
              feed = json.load(handle)
          assets = feed.get("Assets") if isinstance(feed, dict) else None
          if not isinstance(assets, list):
              raise SystemExit("The feed has no Assets array.")
          wanted = key(sys.argv[2])
          versions = [key(asset.get("Version")) for asset in assets if isinstance(asset, dict)]
          if any(version > wanted for version in versions):
              raise SystemExit("A newer version is already published on this channel. Publishing an older one would roll the feed back; release a new patch instead.")
          print("true" if wanted in versions else "false")
          PY
          )" ;;
            *) echo "Unexpected HTTP status $status from the osx feed." >&2; exit 1 ;;
          esac
          printf 'PUBLISHED=%s\n' "$published" >> "$GITHUB_ENV"
          if [[ "$published" == true ]]; then echo "::notice::Version $VERSION is already published on the osx channel; packing and publishing are skipped."; fi

      - name: Configure isolated work directories
        if: env.PUBLISHED != 'true'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/remnifold-velopack-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-osx"
          test ! -e "$root"
          mkdir -p "$root"/{tools,dotnet-home,nuget}
          {
            printf 'CI_ROOT=%s\n' "$root"
            printf 'DOTNET_CLI_HOME=%s/dotnet-home\nNUGET_PACKAGES=%s/nuget\n' "$root" "$root"
          } >> "$GITHUB_ENV"

      - name: Install Velopack CLI 1.2.161 into the work folder
        if: env.PUBLISHED != 'true'
        run: |
          set -euo pipefail
          # dotnet が無いランナーでは、作業フォルダーへ入れる（ランナーの全体には入れない）。
          if ! command -v dotnet >/dev/null; then
            curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$CI_ROOT/tools/dotnet-install.sh"
            bash "$CI_ROOT/tools/dotnet-install.sh" --channel 8.0 --install-dir "$CI_ROOT/tools/dotnet"
            printf '%s\n' "$CI_ROOT/tools/dotnet" >> "$GITHUB_PATH"
            printf 'DOTNET_ROOT=%s\n' "$CI_ROOT/tools/dotnet" >> "$GITHUB_ENV"
            export PATH="$CI_ROOT/tools/dotnet:$PATH" DOTNET_ROOT="$CI_ROOT/tools/dotnet"
          fi
          dotnet --version
          # tool-path で入れた vpk（apphost）は、DOTNET_ROOT が無いと既定の場所だけで runtime を探す。macOS のランナーの
          # dotnet は既定の場所の外にあり、hostfxr を見つけられずに終了コード 131（0x80008083）で落ちる（Scriptura で確認）
          # ため、実体の場所を渡す。
          if [[ -z "${DOTNET_ROOT:-}" ]]; then
            DOTNET_ROOT="$(dirname "$(python3 -I -c 'import os, shutil; print(os.path.realpath(shutil.which("dotnet")))')")"
            export DOTNET_ROOT
            printf 'DOTNET_ROOT=%s\n' "$DOTNET_ROOT" >> "$GITHUB_ENV"
          fi
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          dotnet tool install vpk --version 1.2.161 --tool-path "$CI_ROOT/tools/vpk"
          printf '%s\n' "$CI_ROOT/tools/vpk" >> "$GITHUB_PATH"
          # 出力を変数に取ってから照合する（パイプで grep -q が先に終わると、pipefail で誤って失敗になるため）。
          help="$("$CI_ROOT/tools/vpk/vpk" --skip-updates --help 2>&1 | sed $'s/\x1b\\[[0-9;]*m//g')"
          grep -q 'Velopack CLI 1\.2\.161' <<<"$help" || { printf '%s\n' "$help"; exit 1; }

      - name: Check PowerShell, the R2 transfer code, and Gatekeeper
        if: env.PUBLISHED != 'true'
        run: |
          set -euo pipefail
          pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            if ($PSVersionTable.PSVersion -lt [version]"7.2") { throw "PowerShell 7.2 or later is required." }
            . ./scripts/velopack/R2Distribution.Common.ps1
            if (-not ("Kagayoi.R2.Transfer" -as [type])) { throw "The R2 transfer code did not load." }
            Write-Host "PowerShell $($PSVersionTable.PSVersion); the R2 transfer code compiled."'
          # 公証済みかどうかの spctl の判定（pack-macos.sh の検査）には、Gatekeeper の評価が有効なことが要る。
          status="$(spctl --status 2>&1 || true)"
          echo "$status"
          if ! grep -q 'assessments enabled' <<<"$status"; then
            sudo spctl --global-enable || sudo spctl --master-enable || true
            status="$(spctl --status 2>&1 || true)"
            echo "$status"
            grep -q 'assessments enabled' <<<"$status" || { echo 'Gatekeeper assessments are disabled and could not be enabled.' >&2; exit 1; }
          fi

      - name: Build the native executable
        if: env.PUBLISHED != 'true'
        # 署名用のキーチェーンを用意する前に、署名用 Secrets なしでビルドする。梱包スクリプトの cargo build と同じ
        # コマンド・同じ target なので、梱包では再コンパイルされない（既定の機能のみ。update-feed-test を含めない）。
        # build.rs が要る固定版の esbuild なども、先に用意する。
        run: |
          set -euo pipefail
          cargo xtask prepare
          cargo build --locked --release --target aarch64-apple-darwin --target-dir "$RUNNER_TEMP/remnifold-target" --bin remnifold

      - name: Prepare the signing keychain
        # Apple の Secrets はこの step にだけ渡す。証明書と公証の鍵は一時キーチェーンへ入れ、ファイルはすぐ消す。
        if: env.PUBLISHED != 'true'
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          MACOS_SIGN_APP_IDENTITY: ${{ vars.MACOS_SIGN_APP_IDENTITY }}
          MACOS_SIGN_INSTALL_IDENTITY: ${{ vars.MACOS_SIGN_INSTALL_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 APPLE_P12_PASSWORD APPLE_NOTARY_API_KEY_P8_BASE64 APPLE_NOTARY_API_KEY_ID APPLE_NOTARY_API_ISSUER_ID MACOS_SIGN_APP_IDENTITY MACOS_SIGN_INSTALL_IDENTITY; do
            [[ -n "${!name:-}" ]] || { echo "::error::The secret or variable $name is not set in the r2-release environment."; exit 1; }
          done
          dir="$RUNNER_TEMP/remnifold-signing"
          mkdir -m 700 "$dir"
          printf '%s' "$APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$dir/application.p12"
          printf '%s' "$APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64" | base64 --decode > "$dir/installer.p12"
          # Windows で保存した p8 は改行が CRLF のことがあり、notarytool は CR の混じった PEM を invalidAsn1 で拒否する。
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode | tr -d '\r' > "$dir/notary-key.p8"
          keychain_password="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$keychain_password"
          keychain="$dir/remnifold-signing.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain"
          # 自動ロックしない（梱包と公証の間にロックされないようにする）。
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          for p12 in application installer; do
            security import "$dir/$p12.p12" -k "$keychain" -f pkcs12 -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          xcrun notarytool store-credentials remnifold-notary --key "$dir/notary-key.p8" --key-id "$APPLE_NOTARY_API_KEY_ID" --issuer "$APPLE_NOTARY_API_ISSUER_ID" --keychain "$keychain"
          rm -f "$dir/application.p12" "$dir/installer.p12" "$dir/notary-key.p8"
          printf 'REMNIFOLD_MAC_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
          # 変数の identity 名が、入れた証明書に実在することを確かめる（名前の取り違えを梱包の前に検出する）。
          identities="$(security find-identity -v "$keychain")"
          grep -qF "$MACOS_SIGN_APP_IDENTITY" <<<"$identities" || { echo 'The application identity was not found in the signing keychain.' >&2; exit 1; }
          grep -qF "$MACOS_SIGN_INSTALL_IDENTITY" <<<"$identities" || { echo 'The installer identity was not found in the signing keychain.' >&2; exit 1; }
          echo 'The signing keychain is ready.'

      - name: Pack, sign, and notarize the installer
        # Secrets の値は渡さない（identity 名・プロファイル名・キーチェーンのパスだけ）。packId は本番の RemnifoldApp（既定）。
        if: env.PUBLISHED != 'true'
        env:
          REMNIFOLD_MAC_SIGN_APP_IDENTITY: ${{ vars.MACOS_SIGN_APP_IDENTITY }}
          REMNIFOLD_MAC_SIGN_INSTALL_IDENTITY: ${{ vars.MACOS_SIGN_INSTALL_IDENTITY }}
          REMNIFOLD_MAC_NOTARY_PROFILE: remnifold-notary
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/remnifold-installer"
          mkdir "$work"
          printf 'WORK_DIR=%s\n' "$work" >> "$GITHUB_ENV"
          bash scripts/velopack/pack-macos.sh "$work" --sign --cargo-target-dir "$RUNNER_TEMP/remnifold-target"

      - name: Remove the signing keychain and temporary files
        if: always()
        run: |
          if [[ -n "${REMNIFOLD_MAC_KEYCHAIN:-}" && -f "$REMNIFOLD_MAC_KEYCHAIN" ]]; then
            security delete-keychain "$REMNIFOLD_MAC_KEYCHAIN" || true
          fi
          rm -rf "$RUNNER_TEMP/remnifold-signing"

      - name: Publish the feed and installer to R2
        if: env.PUBLISHED != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # 版付きの成果物は新規作成のみ（上書きしない）。releases.osx.json は最後に置く。
          pwsh -NoProfile -File scripts/velopack/publish-r2.ps1 -PackagesDirectory "$WORK_DIR/packages" -Channel osx

  linux-installer:
    name: linux-installer (${{ matrix.channel }})
    needs: gate
    if: github.repository == '1llum1n4t1s/remnifold' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc の下限が黙って上がらないよう、ubuntu-latest ではなく ubuntu-24.04（glibc 2.39）に固定する。
          - os: ubuntu-24.04
            channel: linux-x64
            machine: x86_64
          - os: ubuntu-24.04-arm
            channel: linux-arm64
            machine: aarch64
    concurrency:
      group: release-velopack-${{ matrix.channel }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    environment: r2-release
    timeout-minutes: 75
    env:
      # vpk 1.2.161 を、ランナーにある新しい .NET でも動かす（ランナーに合う版が無い場合に備える）。
      DOTNET_ROLL_FORWARD: Major
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact source commit without executable Actions
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Unexpected commit id.' >&2; exit 1; }
          git init .
          git config core.autocrlf false
          git config core.eol lf
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT CHECKOUT_TOKEN authorization
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install locked Rust toolchain
        run: |
          set -euo pipefail
          # matrix の runs-on と実際の CPU の取り違えを、梱包の前に検出する（pack-linux.sh は uname -m でチャネルを決める）。
          test "$(uname -m)" = "${{ matrix.machine }}"
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0

      - name: Require the version tag to match the package version
        run: |
          set -euo pipefail
          cargo xtask ci-release-tag
          printf 'VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Skip when this version is already published on the channel
        # 公開 URL のフィードを Secrets なしで取得する（404 は未配信）。
        run: |
          set -euo pipefail
          published=false
          feed="$RUNNER_TEMP/releases.json"
          status="$(curl -sS --retry 3 -H 'Cache-Control: no-cache' -o "$feed" -w '%{http_code}' "https://remnifold-updates.kagayoi.com/velopack/releases.${{ matrix.channel }}.json")"
          case "$status" in
            404) echo 'No feed yet on the ${{ matrix.channel }} channel.' ;;
            200)
              # より新しい版が載っていれば止める（古い版を配信すると、固定名の AppImage とフィードが巻き戻るため）。
              # 読み取れない本文・Assets が配列でない・版の形が想定外のときも失敗にする（未配信と誤認しない）。
              published="$(python3 -I - "$feed" "$VERSION" <<'PY'
          import json, re, sys

          def key(value):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", value if isinstance(value, str) else "")
              if not match:
                  raise SystemExit("Unexpected version in the feed: %r" % (value,))
              return tuple(int(part) for part in match.groups())

          with open(sys.argv[1], encoding="utf-8") as handle:
              feed = json.load(handle)
          assets = feed.get("Assets") if isinstance(feed, dict) else None
          if not isinstance(assets, list):
              raise SystemExit("The feed has no Assets array.")
          wanted = key(sys.argv[2])
          versions = [key(asset.get("Version")) for asset in assets if isinstance(asset, dict)]
          if any(version > wanted for version in versions):
              raise SystemExit("A newer version is already published on this channel. Publishing an older one would roll the feed back; release a new patch instead.")
          print("true" if wanted in versions else "false")
          PY
          )" ;;
            *) echo "Unexpected HTTP status $status from the ${{ matrix.channel }} feed." >&2; exit 1 ;;
          esac
          printf 'PUBLISHED=%s\n' "$published" >> "$GITHUB_ENV"
          if [[ "$published" == true ]]; then echo "::notice::Version $VERSION is already published on the ${{ matrix.channel }} channel; packing and publishing are skipped."; fi

      - name: Configure isolated work directories
        if: env.PUBLISHED != 'true'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/remnifold-velopack-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.channel }}"
          test ! -e "$root"
          mkdir -p "$root"/{tools,dotnet-home,nuget}
          {
            printf 'CI_ROOT=%s\n' "$root"
            printf 'DOTNET_CLI_HOME=%s/dotnet-home\nNUGET_PACKAGES=%s/nuget\n' "$root" "$root"
          } >> "$GITHUB_ENV"

      - name: Install Velopack CLI 1.2.161 and squashfs-tools
        if: env.PUBLISHED != 'true'
        run: |
          set -euo pipefail
          # dotnet が無いランナーでは、作業フォルダーへ入れる（ランナーの全体には入れない）。
          if ! command -v dotnet >/dev/null; then
            curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$CI_ROOT/tools/dotnet-install.sh"
            bash "$CI_ROOT/tools/dotnet-install.sh" --channel 8.0 --install-dir "$CI_ROOT/tools/dotnet"
            printf '%s\n' "$CI_ROOT/tools/dotnet" >> "$GITHUB_PATH"
            # --tool-path で入れた vpk が、この dotnet を見つけられるようにする。
            printf 'DOTNET_ROOT=%s\n' "$CI_ROOT/tools/dotnet" >> "$GITHUB_ENV"
            export PATH="$CI_ROOT/tools/dotnet:$PATH" DOTNET_ROOT="$CI_ROOT/tools/dotnet"
          fi
          dotnet --version
          # tool-path で入れた vpk（apphost）は、DOTNET_ROOT が無いと既定の場所だけで runtime を探すため、実体の場所を渡す。
          if [[ -z "${DOTNET_ROOT:-}" ]]; then
            DOTNET_ROOT="$(dirname "$(python3 -I -c 'import os, shutil; print(os.path.realpath(shutil.which("dotnet")))')")"
            export DOTNET_ROOT
            printf 'DOTNET_ROOT=%s\n' "$DOTNET_ROOT" >> "$GITHUB_ENV"
          fi
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          dotnet tool install vpk --version 1.2.161 --tool-path "$CI_ROOT/tools/vpk"
          printf '%s\n' "$CI_ROOT/tools/vpk" >> "$GITHUB_PATH"
          # 出力を変数に取ってから照合する（パイプで grep -q が先に終わると、pipefail で誤って失敗になるため）。
          help="$("$CI_ROOT/tools/vpk/vpk" --skip-updates --help 2>&1 | sed $'s/\x1b\\[[0-9;]*m//g')"
          grep -q 'Velopack CLI 1\.2\.161' <<<"$help" || { printf '%s\n' "$help"; exit 1; }
          # vpk は Linux 上では外部の mksquashfs で squashfs を作る。
          if ! command -v mksquashfs >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends squashfs-tools
          fi

      - name: Check PowerShell and the R2 transfer code
        if: env.PUBLISHED != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.2') { throw 'PowerShell 7.2 or later is required.' }
          . ./scripts/velopack/R2Distribution.Common.ps1
          if (-not ('Kagayoi.R2.Transfer' -as [type])) { throw 'The R2 transfer code did not load.' }
          Write-Host "PowerShell $($PSVersionTable.PSVersion); the R2 transfer code compiled."

      - name: Pack the installer
        # 本番の構成（既定の機能のみ。packId は既定の RemnifoldApp）で、pack-linux.sh が自分でビルドして梱包する。
        if: env.PUBLISHED != 'true'
        run: |
          set -euo pipefail
          work="$CI_ROOT/pack"
          mkdir "$work"
          printf 'WORK_DIR=%s\n' "$work" >> "$GITHUB_ENV"
          bash scripts/velopack/pack-linux.sh "$work"
          df -h / "$CI_ROOT" || true

      - name: Check the glibc requirement of the packed executable
        # 動作要件（glibc 2.39 以降）を超える記号を使っていれば失敗させる。
        if: env.PUBLISHED != 'true'
        run: |
          set -euo pipefail
          exe="$WORK_DIR/payload/remnifold"
          symbols="$(objdump -T "$exe")"
          max="$(grep -o 'GLIBC_[0-9][0-9.]*' <<<"$symbols" | sed 's/^GLIBC_//' | sort -V | tail -n 1 || true)"
          echo "Highest GLIBC symbol version: ${max:-none}"
          [[ -n "$max" ]] || { echo 'No GLIBC symbol versions were found; the executable could not be inspected.' >&2; exit 1; }
          highest="$(printf '%s\n%s\n' "$max" 2.39 | sort -V | tail -n 1)"
          [[ "$highest" == 2.39 ]] || { echo "The executable requires glibc $max, newer than 2.39." >&2; exit 1; }
          readelf -d "$exe" | grep NEEDED || true

      - name: Publish the feed and installer to R2
        if: env.PUBLISHED != 'true'
        shell: pwsh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASE_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          R2_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          # 版付きの成果物は新規作成のみ（上書きしない）。releases.<channel>.json は最後に置く。
          & ./scripts/velopack/publish-r2.ps1 -PackagesDirectory (Join-Path $env:WORK_DIR 'packages') -Channel '${{ matrix.channel }}'
