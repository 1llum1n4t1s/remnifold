[package]
name = "remnifold-xtask"
version = "1.0.17"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "multipart"] }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11"
tar = "0.4"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
